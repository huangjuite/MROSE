imu0:
  T_i_b:
    - [ 0.000, -1.000, -0.000,  0.020]
    - [-1.000, -0.000, -0.000,  0.001]
    - [-0.000,  0.000, -1.000,  0.116]
    - [ 0.000,  0.000,  0.000,  1.000]
  accelerometer_noise_density: 0.0015903917463388937
  accelerometer_random_walk: 7.316842828686425e-05
  gyroscope_noise_density: 3.581400308085914e-05
  gyroscope_random_walk: 1.1036348379504944e-06
  gravity: 9.81

xwr:
  T_r_i:
    - [-0.000, -1.000, -0.000, -0.119]
    - [-1.000,  0.000,  0.000,  0.048]
    - [-0.000,  0.000, -1.000,  0.085]
    - [ 0.000,  0.000,  0.000,  1.000]
  doppler_sigma: 0.124 # doppler uncertainty (m/s)

log_level: debug # options: debug, info, warn, error, fatal

odom:
  imu: imu0
  radar: [xwr]
  doppler_inlier_thresh: 0.124
  optimization_window: 3.0 # seconds
  bv_use_huber: true
  bv_huber_k: 0.3
  marginalization_sigma: [10, 10, 10, 10, 10, 10] # rx, ry, rz, tx, ty, tz
  use_static_init: true
  static_init_window: 6.0 # seconds
  static_init_threshold: 0.2 # acc variation

ros:
  imu_topic: /imu/data
  radars:
    xwr:
      topic: /xwr/point_cloud
      type: PointCloud2
