odom:
  imu: imu1
  radar: [radar0, radar1]
  doppler_inlier_thresh: 0.05512325
  static_init_window: 2.0 # seconds
  static_init_threshold: 0.1
  optimization_window: 5.0 # seconds

loop_close:
  enable_loop_close: false
  loop_close_rate: 40 # frames
  loop_ignore: 100 # frames
  key_frame_search: 30 # frames
  loop_distance_thresh: 2 # meters
  snr_thresh: 1.6 # log dB
  process_voxel_size: 0.2 # meters
  ndt_voxel_size: 0.5 # meters
  ndt_thread: 8

mapping:
  render_rate: 1.0 # Hz
  map_snr_thresh: 1.6 # log dB
