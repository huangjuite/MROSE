imu0:
  T_i_b:
    - [1.000,  0.000,  0.000, -1.326]
    - [0.000, -1.000,  0.000,  0.050]
    - [0.000,  0.000, -1.000,  1.731]
    - [0.000,  0.000,  0.000,  1.000]
  accelerometer_noise_density: 0.0015903917463388937
  accelerometer_random_walk: 7.316842828686425e-05
  gyroscope_noise_density: 3.581400308085914e-05
  gyroscope_random_walk: 1.1036348379504944e-06
  gravity: 9.80126

radar_1:
  T_r_i:
    - [ 0.707,  0.707,  0.000, -0.919]
    - [ 0.707, -0.707, -0.000, -1.106]
    - [-0.000,  0.000, -1.000,  0.823]
    - [ 0.000,  0.000,  0.000,  1.000]
  doppler_sigma: 0.1 # doppler uncertainty (m/s)


radar_2:
  T_r_i:
    - [-0.707,  0.707,  0.000,  0.848]
    - [ 0.707,  0.707,  0.000, -1.176]
    - [ 0.000,  0.000, -1.000,  0.823]
    - [ 0.000,  0.000,  0.000,  1.000]
  doppler_sigma: 0.1 # doppler uncertainty (m/s)

log_level: debug # options: debug, info, warn, error, fatal

odom:
  imu: imu0
  radar: [radar_1, radar_2]
  doppler_inlier_thresh: 1
  optimization_window: 3.0 # seconds
  bv_use_huber: true
  bv_huber_k: 0.3
  marginalization_sigma: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001] # rx, ry, rz, tx, ty, tz
  use_static_init: true
  static_init_window: 6.0 # seconds
  static_init_threshold: 0.4 # acc variation
