#!/usr/bin/env python3
PACKAGE = "radar_odom"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("use_r0", bool_t, 0, "use_r0", True)
gen.add("use_r1", bool_t, 0, "use_r1", True)

gen.add("R0x", double_t, 0, "R0x", 0.0001, -3.14159265, 3.14159265)
gen.add("R0y", double_t, 0, "R0y", 0.0001, -3.14159265, 3.14159265)
gen.add("R0z", double_t, 0, "R0z", 0.0001, -3.14159265, 3.14159265)

gen.add("R1x", double_t, 0, "R1x", 0.0001, -3.14159265, 3.14159265)
gen.add("R1y", double_t, 0, "R1y", 0.0001, -3.14159265, 3.14159265)
gen.add("R1z", double_t, 0, "R1z", 0.0001, -3.14159265, 3.14159265)

exit(gen.generate(PACKAGE, "radar_odom", "extrinsic"))