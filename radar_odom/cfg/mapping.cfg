#!/usr/bin/env python3
PACKAGE = "radar_odom"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("map_voxel",   bool_t,   0, "use voxel filter on full map",  False)
gen.add("voxel_size", double_t, 0, "full map voxel leaf size", 0.2,  0.01, 1)
gen.add("snr_thresh", double_t, 0, "signal to noise ratio thresh hold (log dB)", 4,  1, 20)

exit(gen.generate(PACKAGE, "radar_odom", "mapping"))