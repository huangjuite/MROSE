[build-system]
requires = ["scikit-build-core>=0.10.0", "nanobind>=2.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mrose"
version = "0.1.0"
description = "MROSE Python interface"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Ray", email = "juiteh@andrew.cmu.edu" }]
dependencies = ["numpy", "pyyaml"]

[tool.scikit-build]
wheel.packages = ["python/mrose"]
build-dir = "build"
editable.rebuild = true

[tool.scikit-build.cmake]
source-dir = "src"
version = ">=3.22"
args = ["-DBUILD_PYTHON_BINDINGS=ON"]
